name: ExampleApp
options:
  bundleIdPrefix: com.apus
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

packages:
  Apus:
    path: ../

targets:
  ExampleApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Apus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Apus Demo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          OTHER_LDFLAGS: ["-Xlinker", "-interposable"]
          ENABLE_DEBUG_DYLIB: NO
